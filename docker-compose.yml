# City Wallet — Docker Compose
# Fixed: Added aggregator service, corrected env vars, redis config, service dependencies

services:
  redis:
    image: redis:7-alpine
    container_name: cw_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wallet_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cw_backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-insecure-change-me}
      - DEBUG=${DEBUG:-False}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - INPUT_TOPIC=${INPUT_TOPIC}
      - MERCHANT_TOPIC=${MERCHANT_TOPIC}
      - cred=${cred}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wallet_network
    restart: unless-stopped

  contextEnrichment:
    build: ./contextEnrichment
    container_name: cw_context
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CONTENT_TOPIC=${CONTENT_TOPIC}
      - cred=${cred}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wallet_network
    restart: unless-stopped

  # FIX: aggregator was entirely missing from docker-compose
  aggregator:
    build: ./aggregator
    container_name: cw_aggregator
    ports:
      - "8004:8004"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AGGREGATOR_TOPIC=${AGGREGATOR_TOPIC}
      - cred=${cred}
      # No REDIS_PASSWORD needed unless you configure redis auth
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wallet_network
    restart: unless-stopped

  llmService:
    build: ./llmService
    container_name: cw_llm
    ports:
      - "8002:8002"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GROQ_API_KEY=${GROQ_API_KEY}
      - cred=${cred}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wallet_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    build: ./frontend
    container_name: cw_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - wallet_network
    restart: unless-stopped

networks:
  wallet_network:
    driver: bridge

volumes:
  redis_data:
